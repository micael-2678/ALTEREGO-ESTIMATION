name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Tests unitaires
        run: yarn test
      - name: Configuration Docker Compose / Traefik
        run: |
          docker compose -f docker-compose.yml config -q
          # Les étiquettes Traefik doivent être lues par "docker compose up" (pas sous deploy:)
          docker compose -f docker-compose.yml config --format json | jq -e '.services.app.labels["traefik.enable"] == "true"'
      - name: Build
        run: yarn build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Tests d'intégration de l'API (MongoDB réel)
        run: yarn test:api
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
      - name: Navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: yarn test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
